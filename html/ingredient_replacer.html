<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recipe Room Project</title>
        <link href="../css/ingredient_substitute.css" rel="stylesheet" type="text/css" />
        <link href="../css/navbar.css" rel="stylesheet" type="text/css" />
        <!--Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!--Google Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400;1,500;1,700;1,800;1,900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    </head>

    <body style="background-color: #A27B5C">
        <!--Navbar-->
        <nav class = "navbar navbar-expand-lg">
            <a class = "navbar-brand" href = "../index.html"> Recipe Room </a>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="recipe_filter.html"> Recipe Filter </a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="ingredient_replacer.html"> Ingredient Substitute Generator </a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class = "main-content">
            <!--Substitute Portion-->
            <div class = "substitute-container">
                <div class = "substitute-desc">
                    <h3 style="font-size:40px;"> Ingredient Substitute </h3>
                    <p> You found the perfect recipe, but you're missing one or two ingredients... wonder if you have a substitute lying around at home? </p>
                </div>
                <div class = "substitute-gen">
                    <div class = "substitute-form">
                        <!--<h4 class = "option-header"> Cuisine </h4>--> 
                        <p class = "substitute-desc"> Enter the ingredient you want to find a substitute for! </p>
                        <input
                            id = "substitute-input"
                            class = ""
                            type = "text"
                            name = "substitute"
                            placeholder = ""
                        />
                        <br>
                    </div>
                    <div class = "substitute-submission">
                        <button class="submitButton btn btn-success" id="submitButton" style="width:12%; margin-top:1%;"> Find a Substitute! </button>
                    </div>
                </div>
            </div>
            <!-- Results of Filter -->
            <div class = "substitute-result" id = "substitute-result">
            </div>
        </div>

        <!--Scripts-->
        <script src="../js/ingredient_substitute.js"></script>

        <!--Bootstrap-->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    
    </body>

</html>
